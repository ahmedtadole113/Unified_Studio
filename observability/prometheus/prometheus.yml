global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - 'alerts.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'ues_control_plane'
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['portal-backend:8000']

  - job_name: 'redpanda'
    scrape_interval: 15s
    metrics_path: '/public_metrics'
    static_configs:
      - targets: ['redpanda:9644']

  - job_name: 'rabbitmq'
    scrape_interval: 15s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['rabbitmq:15692']

  - job_name: 'sre_data_generator'
    scrape_interval: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['data-generator:8000']

  - job_name: 'loki'
    scrape_interval: 30s
    static_configs:
      - targets: ['loki:3100']

  - job_name: 'tempo'
    scrape_interval: 30s
    static_configs:
      - targets: ['tempo:3200']

